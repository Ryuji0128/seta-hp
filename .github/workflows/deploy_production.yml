name: Deploy_Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: seta-seisakusyo/seta-hp

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: next/yarn.lock

      - name: Install dependencies
        working-directory: ./next
        run: yarn install --frozen-lockfile

      - name: Run lint
        working-directory: ./next
        run: yarn lint

      - name: Run tests
        working-directory: ./next
        run: yarn test

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./next
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          envs: IMAGE_TAG,GH_PAT,GH_USERNAME
          script: |
            set -e

            COMPOSE_DIR=~/seta-hp
            REGISTRY=ghcr.io
            IMAGE=seta-seisakusyo/seta-hp
            FULL_IMAGE="${REGISTRY}/${IMAGE}:${IMAGE_TAG}"

            echo "=== Deploying ${FULL_IMAGE} ==="

            cd "${COMPOSE_DIR}"

            # 設定ファイルをデプロイ対象SHAから同期（イメージに含まれないインフラ設定）
            echo "Syncing config files from ${IMAGE_TAG}..."
            git fetch origin main --quiet
            if ! git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null; then
              # mainに含まれないSHA（workflow_dispatch等）→ 全refをfetch
              echo "SHA not found in main, fetching all refs..."
              git fetch origin --quiet
              if ! git cat-file -e "${IMAGE_TAG}^{commit}" 2>/dev/null; then
                echo "ERROR: commit ${IMAGE_TAG} not found in repository"
                exit 1
              fi
            fi
            for dir in nginx scripts .github; do
              rm -rf "${dir}"
            done
            git checkout "${IMAGE_TAG}" -- docker-compose.yml nginx/ scripts/ .github/

            # 現在のIMAGE_TAGを保持（ロールバック用）
            PREV_TAG=$(grep '^IMAGE_TAG=' .env 2>/dev/null | cut -d= -f2 || echo "")
            echo "Previous IMAGE_TAG: ${PREV_TAG:-none}"

            # レジストリログイン
            echo "${GH_PAT}" | docker login "${REGISTRY}" -u "${GH_USERNAME}" --password-stdin

            # 指定SHAのイメージをpull
            docker pull "${FULL_IMAGE}"

            # .envからDATABASE_URLを取得（Composeと同じ設定源）
            DB_URL=$(grep '^DATABASE_URL=' next/.env 2>/dev/null | cut -d= -f2- || echo "")
            if [ -z "${DB_URL}" ]; then
              DB_URL="mysql://app_user:${MYSQL_PASSWORD:-app_pass}@mysql:3306/app_db"
            fi

            # マイグレーションを先に実行（失敗時はデプロイ中止）
            echo "Running database migrations..."
            docker run --rm \
              --network seta-hp_default \
              -e DATABASE_URL="${DB_URL}" \
              "${FULL_IMAGE}" \
              node node_modules/prisma/build/index.js migrate deploy

            # IMAGE_TAGを.envに書き出してcompose起動
            echo "Updating IMAGE_TAG=${IMAGE_TAG}"
            sed -i '/^IMAGE_TAG=/d' .env 2>/dev/null || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env

            # アプリ更新（nextのみ再作成、mysql/nginxは変更なければそのまま）
            docker compose -f docker-compose.yml up -d --no-deps next

            # ヘルスチェック（ホスト側からcurlで確認）
            echo "Waiting for health check..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:2999/api/health > /dev/null 2>&1; then
                echo "Health check passed!"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "ERROR: Health check failed after 100s."
                echo "Current IMAGE_TAG: ${IMAGE_TAG}"
                echo "Previous IMAGE_TAG: ${PREV_TAG:-none}"
                docker compose -f docker-compose.yml logs next --tail=20
                exit 1
              fi
              sleep 5
            done

            # SSL証明書の確認・更新
            CERT_PATH="./certbot/conf/live/${SERVER_NAME:-setaseisakusyo.com}/fullchain.pem"
            if [ ! -f "$CERT_PATH" ]; then
              echo "SSL certificate not found. Obtaining..."
              docker compose --profile certbot run --rm certbot
              docker compose -f docker-compose.yml restart nginx
            else
              echo "Checking SSL certificate renewal..."
              docker compose --profile certbot run --rm certbot renew --quiet || true
              docker compose -f docker-compose.yml exec -T nginx nginx -s reload || true
            fi

            # 古いイメージのクリーンアップ（直近3世代を保持、CreatedAtで時系列ソート）
            echo "Cleaning up old images..."
            docker images "${REGISTRY}/${IMAGE}" --format '{{.CreatedAt}}\t{{.Tag}}\t{{.ID}}' \
              | grep -v '<none>' | grep -v 'latest' \
              | sort -r | tail -n +4 \
              | awk -F'\t' '{print $3}' | xargs -r docker rmi 2>/dev/null || true

            echo "=== Deployment complete: ${IMAGE_TAG} ==="
