<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgl)"/>

  <!-- workpiece (acrylic sheet) -->
  <g stroke="rgba(10, 10, 10, 0.3)" stroke-width="0.8" fill="rgba(255,255,255,0.4)">
    <rect x="80" y="150" width="240" height="160" rx="2"/>
  </g>

  <!-- cut path on workpiece -->
  <path d="M 110 180 L 180 180 L 180 230 L 250 230 L 250 200 L 290 200 L 290 280 L 110 280 Z"
        stroke="rgba(180, 83, 9, 0.6)" stroke-width="1" fill="rgba(180, 83, 9, 0.05)"
        stroke-dasharray="3 2"/>

  <!-- laser beam (crosshair) -->
  <g stroke="rgba(180, 83, 9, 0.7)" stroke-width="0.5" fill="none">
    <line x1="200" y1="60" x2="200" y2="200"/>
    <circle cx="200" cy="210" r="4" stroke-width="0.8"/>
    <circle cx="200" cy="210" r="8" stroke-width="0.4" opacity="0.5"/>
    <line x1="180" y1="210" x2="220" y2="210" opacity="0.7"/>
  </g>

  <!-- laser head -->
  <g stroke="rgba(10, 10, 10, 0.5)" stroke-width="0.8" fill="rgba(255,255,255,0.6)">
    <rect x="180" y="45" width="40" height="22" rx="1"/>
    <line x1="190" y1="67" x2="190" y2="78"/>
    <line x1="210" y1="67" x2="210" y2="78"/>
    <line x1="200" y1="78" x2="200" y2="88"/>
  </g>

  <!-- labels -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="60" y="350">i.  Laser Cutting</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="60" y="368">0.1mm TOLERANCE</text>
  </g>

  <!-- measurement -->
  <g stroke="rgba(10,10,10,0.3)" stroke-width="0.4">
    <line x1="80" y1="325" x2="320" y2="325"/>
    <line x1="80" y1="322" x2="80" y2="328"/>
    <line x1="320" y1="322" x2="320" y2="328"/>
  </g>
</svg>
