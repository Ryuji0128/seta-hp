<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg16)"/>

  <!-- frame -->
  <g stroke="rgba(10, 10, 10, 0.18)" stroke-width="0.8" fill="rgba(255,255,255,0.4)">
    <rect x="50" y="100" width="300" height="310" rx="3"/>
  </g>

  <!-- 16 cards: 4 cols x 4 rows -->
  <g stroke="rgba(10, 10, 10, 0.35)" stroke-width="0.7" fill="rgba(180, 83, 9, 0.04)">
    <!-- row 1 -->
    <rect x="68" y="115" width="42" height="62" rx="1.5"/>
    <rect x="120" y="115" width="42" height="62" rx="1.5"/>
    <rect x="172" y="115" width="42" height="62" rx="1.5"/>
    <rect x="224" y="115" width="42" height="62" rx="1.5"/>
    <rect x="276" y="115" width="42" height="62" rx="1.5"/>

    <!-- row 2 -->
    <rect x="68" y="185" width="42" height="62" rx="1.5"/>
    <rect x="120" y="185" width="42" height="62" rx="1.5"/>
    <rect x="172" y="185" width="42" height="62" rx="1.5"/>
    <rect x="224" y="185" width="42" height="62" rx="1.5"/>

    <!-- row 3 -->
    <rect x="68" y="255" width="42" height="62" rx="1.5"/>
    <rect x="120" y="255" width="42" height="62" rx="1.5"/>
    <rect x="172" y="255" width="42" height="62" rx="1.5"/>

    <!-- row 4 -->
    <rect x="68" y="325" width="42" height="62" rx="1.5"/>
    <rect x="120" y="325" width="42" height="62" rx="1.5"/>
    <rect x="172" y="325" width="42" height="62" rx="1.5"/>
    <rect x="224" y="325" width="42" height="62" rx="1.5"/>
  </g>

  <!-- mount points -->
  <g fill="rgba(10,10,10,0.25)">
    <circle cx="60" cy="110" r="1.5"/>
    <circle cx="340" cy="110" r="1.5"/>
    <circle cx="60" cy="400" r="1.5"/>
    <circle cx="340" cy="400" r="1.5"/>
  </g>

  <!-- corner serial -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="50" y="445">Ref. 016</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="50" y="463">16-CARD DISPLAY</text>
  </g>

  <!-- ruler marks -->
  <g stroke="rgba(10,10,10,0.25)" stroke-width="0.5">
    <line x1="300" y1="455" x2="340" y2="455"/>
    <line x1="300" y1="452" x2="300" y2="458"/>
    <line x1="340" y1="452" x2="340" y2="458"/>
  </g>
</svg>
