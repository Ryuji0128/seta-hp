<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg8)"/>

  <!-- frame -->
  <g stroke="rgba(10, 10, 10, 0.18)" stroke-width="0.8" fill="rgba(255,255,255,0.4)">
    <rect x="70" y="120" width="260" height="270" rx="3"/>
  </g>

  <!-- 8 cards: 4 cols x 2 rows -->
  <g stroke="rgba(10, 10, 10, 0.35)" stroke-width="0.7" fill="rgba(180, 83, 9, 0.04)">
    <rect x="86" y="138" width="48" height="68" rx="1.5"/>
    <rect x="142" y="138" width="48" height="68" rx="1.5"/>
    <rect x="198" y="138" width="48" height="68" rx="1.5"/>
    <rect x="254" y="138" width="48" height="68" rx="1.5"/>

    <rect x="86" y="288" width="48" height="68" rx="1.5"/>
    <rect x="142" y="288" width="48" height="68" rx="1.5"/>
    <rect x="198" y="288" width="48" height="68" rx="1.5"/>
    <rect x="254" y="288" width="48" height="68" rx="1.5"/>
  </g>

  <!-- year plate area -->
  <rect x="86" y="218" width="216" height="58" fill="rgba(180,83,9,0.06)" stroke="rgba(180, 83, 9, 0.3)" stroke-width="0.5"/>

  <!-- mount points -->
  <g fill="rgba(10,10,10,0.25)">
    <circle cx="80" cy="130" r="1.5"/>
    <circle cx="320" cy="130" r="1.5"/>
    <circle cx="80" cy="380" r="1.5"/>
    <circle cx="320" cy="380" r="1.5"/>
  </g>

  <!-- corner serial -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="70" y="430">Ref. 008</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="70" y="448">8-CARD DISPLAY</text>
  </g>

  <!-- ruler marks bottom right -->
  <g stroke="rgba(10,10,10,0.25)" stroke-width="0.5">
    <line x1="300" y1="440" x2="330" y2="440"/>
    <line x1="300" y1="437" x2="300" y2="443"/>
    <line x1="330" y1="437" x2="330" y2="443"/>
  </g>
</svg>
