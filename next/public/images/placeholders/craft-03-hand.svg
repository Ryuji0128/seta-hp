<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgh)"/>

  <!-- workpiece (assembled display) -->
  <g stroke="rgba(10, 10, 10, 0.3)" stroke-width="0.8" fill="rgba(255,255,255,0.4)">
    <rect x="100" y="150" width="200" height="140" rx="2"/>
  </g>

  <!-- inner cards 2x2 -->
  <g stroke="rgba(10, 10, 10, 0.35)" stroke-width="0.6" fill="rgba(180, 83, 9, 0.05)">
    <rect x="115" y="165" width="42" height="58" rx="1.5"/>
    <rect x="165" y="165" width="42" height="58" rx="1.5"/>
    <rect x="215" y="165" width="42" height="58" rx="1.5"/>
    <rect x="115" y="230" width="42" height="58" rx="1.5"/>
    <rect x="165" y="230" width="42" height="58" rx="1.5"/>
    <rect x="215" y="230" width="42" height="58" rx="1.5"/>
  </g>

  <!-- file/tool diagonally across (representing chamfering) -->
  <g stroke="rgba(10, 10, 10, 0.55)" stroke-width="1" fill="rgba(255, 255, 255, 0.6)">
    <rect x="240" y="58" width="100" height="14" rx="1.5" transform="rotate(28 290 65)"/>
  </g>
  <g stroke="rgba(180, 83, 9, 0.55)" stroke-width="0.7" fill="none">
    <rect x="252" y="62" width="76" height="6" transform="rotate(28 290 65)"/>
  </g>

  <!-- arrow indicating motion -->
  <g stroke="rgba(180, 83, 9, 0.45)" stroke-width="0.6" fill="none">
    <path d="M 320 60 L 290 130 M 285 124 L 290 130 L 296 122"/>
  </g>

  <!-- inspection marks (checkmarks at corners) -->
  <g stroke="rgba(180, 83, 9, 0.5)" stroke-width="0.8" fill="none">
    <path d="M 105 155 l 4 4 l 8 -8"/>
    <path d="M 285 155 l 4 4 l 8 -8"/>
    <path d="M 105 285 l 4 4 l 8 -8"/>
    <path d="M 285 285 l 4 4 l 8 -8"/>
  </g>

  <!-- labels -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="60" y="335">iii.  Hand Finishing</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="60" y="353">SOLO  ·  ONE AT A TIME</text>
  </g>
</svg>
