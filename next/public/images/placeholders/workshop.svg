<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="0.6" stop-color="#222222"/>
      <stop offset="1" stop-color="#2E2E2E"/>
    </linearGradient>
    <pattern id="dotsw" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="rgba(255,255,255,0.02)"/>
    </pattern>
  </defs>
  <rect width="400" height="500" fill="url(#bgw)"/>
  <rect width="400" height="500" fill="url(#dotsw)"/>

  <!-- floor line (workbench horizon) -->
  <line x1="0" y1="370" x2="400" y2="370" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
  <line x1="0" y1="372" x2="400" y2="372" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

  <!-- workbench (the table) -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="0.7" fill="rgba(255,255,255,0.03)">
    <rect x="30" y="340" width="340" height="30"/>
    <line x1="50" y1="370" x2="50" y2="450"/>
    <line x1="350" y1="370" x2="350" y2="450"/>
  </g>

  <!-- laser machine on bench (left) -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="0.6" fill="rgba(255,255,255,0.03)">
    <rect x="60" y="270" width="120" height="70" rx="2"/>
    <rect x="70" y="280" width="100" height="50" stroke="rgba(180,83,9,0.5)" stroke-width="0.5" fill="rgba(180,83,9,0.04)"/>
  </g>
  <text x="68" y="262" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="7" letter-spacing="2">LASER</text>

  <!-- 3D printer on bench (right) -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="0.6" fill="rgba(255,255,255,0.03)">
    <rect x="220" y="240" width="120" height="100" rx="2"/>
    <!-- gantry -->
    <line x1="230" y1="260" x2="330" y2="260" stroke-width="0.7"/>
    <line x1="280" y1="260" x2="280" y2="320" stroke-width="0.6"/>
    <!-- print bed -->
    <rect x="240" y="315" width="80" height="6" fill="rgba(180,83,9,0.08)" stroke="rgba(180,83,9,0.4)" stroke-width="0.4"/>
  </g>
  <text x="230" y="232" fill="rgba(255,255,255,0.25)" font-family="sans-serif" font-size="7" letter-spacing="2">3D PRINTER</text>

  <!-- pendant light (over center) -->
  <line x1="200" y1="40" x2="200" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="0.4"/>
  <g stroke="rgba(255,255,255,0.3)" stroke-width="0.6" fill="rgba(255,255,255,0.04)">
    <path d="M 188 120 L 212 120 L 218 145 L 182 145 Z"/>
  </g>
  <!-- light cone -->
  <path d="M 182 145 L 130 230 L 270 230 L 218 145 Z" fill="rgba(255, 230, 180, 0.04)" stroke="none"/>

  <!-- window (upper left) -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="0.5" fill="rgba(255,255,255,0.04)">
    <rect x="35" y="80" width="80" height="100"/>
    <line x1="75" y1="80" x2="75" y2="180"/>
    <line x1="35" y1="130" x2="115" y2="130"/>
  </g>

  <!-- signature label bottom -->
  <g fill="rgba(229, 172, 96, 0.55)" font-family="serif" font-style="italic" font-size="10" letter-spacing="1">
    <text x="30" y="475">Workshop · Takaoka, Toyama</text>
  </g>
  <!-- coordinates -->
  <g fill="rgba(255,255,255,0.3)" font-family="sans-serif" font-size="8" letter-spacing="2">
    <text x="270" y="475">36.7548° N</text>
    <text x="270" y="487">137.0257° E</text>
  </g>
</svg>
