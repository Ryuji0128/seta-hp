<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="0.55" stop-color="#262626"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="rgba(255,255,255,0.03)"/>
    </pattern>
  </defs>

  <rect width="500" height="600" fill="url(#bgg)"/>
  <rect width="500" height="600" fill="url(#dots)"/>

  <!-- top crosshair -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="0.5" fill="none">
    <line x1="250" y1="115" x2="250" y2="138"/>
    <line x1="238" y1="126.5" x2="262" y2="126.5"/>
    <circle cx="250" cy="126.5" r="3.5"/>
  </g>

  <!-- card grid: 4 cols x 2 rows -->
  <g stroke="rgba(180, 83, 9, 0.42)" stroke-width="0.8" fill="rgba(255,255,255,0.025)">
    <rect x="118" y="180" width="58" height="80" rx="2"/>
    <rect x="186" y="180" width="58" height="80" rx="2"/>
    <rect x="254" y="180" width="58" height="80" rx="2"/>
    <rect x="322" y="180" width="58" height="80" rx="2"/>

    <rect x="118" y="290" width="58" height="80" rx="2"/>
    <rect x="186" y="290" width="58" height="80" rx="2"/>
    <rect x="254" y="290" width="58" height="80" rx="2"/>
    <rect x="322" y="290" width="58" height="80" rx="2"/>
  </g>

  <!-- year plate line between rows -->
  <line x1="118" y1="278" x2="380" y2="278" stroke="rgba(180, 83, 9, 0.55)" stroke-width="0.5"/>
  <line x1="118" y1="282" x2="380" y2="282" stroke="rgba(180, 83, 9, 0.25)" stroke-width="0.5"/>

  <!-- bottom signature plate -->
  <g fill="rgba(180, 83, 9, 0.35)" font-family="serif" font-style="italic" font-size="8" letter-spacing="3">
    <text x="118" y="408">A W A R D    H I S T O R Y</text>
  </g>

  <!-- bottom right corner mark -->
  <g stroke="rgba(180,83,9,0.6)" stroke-width="0.5" fill="none">
    <line x1="430" y1="540" x2="470" y2="540"/>
    <line x1="450" y1="535" x2="450" y2="545"/>
  </g>
</svg>
