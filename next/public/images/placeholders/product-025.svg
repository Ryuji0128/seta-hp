<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg25)"/>

  <!-- frame -->
  <g stroke="rgba(10, 10, 10, 0.18)" stroke-width="0.8" fill="rgba(255,255,255,0.4)">
    <rect x="42" y="85" width="316" height="345" rx="3"/>
  </g>

  <!-- 25 cards: 5 cols x 5 rows -->
  <g stroke="rgba(10, 10, 10, 0.35)" stroke-width="0.6" fill="rgba(180, 83, 9, 0.04)">
    <!-- row 1 (y=98) -->
    <rect x="58" y="98" width="38" height="56" rx="1.5"/>
    <rect x="106" y="98" width="38" height="56" rx="1.5"/>
    <rect x="154" y="98" width="38" height="56" rx="1.5"/>
    <rect x="202" y="98" width="38" height="56" rx="1.5"/>
    <rect x="250" y="98" width="38" height="56" rx="1.5"/>

    <!-- row 2 (y=162) -->
    <rect x="58" y="162" width="38" height="56" rx="1.5"/>
    <rect x="106" y="162" width="38" height="56" rx="1.5"/>
    <rect x="154" y="162" width="38" height="56" rx="1.5"/>
    <rect x="202" y="162" width="38" height="56" rx="1.5"/>
    <rect x="250" y="162" width="38" height="56" rx="1.5"/>

    <!-- row 3 (y=226) -->
    <rect x="58" y="226" width="38" height="56" rx="1.5"/>
    <rect x="106" y="226" width="38" height="56" rx="1.5"/>
    <rect x="154" y="226" width="38" height="56" rx="1.5"/>
    <rect x="202" y="226" width="38" height="56" rx="1.5"/>
    <rect x="250" y="226" width="38" height="56" rx="1.5"/>

    <!-- row 4 (y=290) -->
    <rect x="58" y="290" width="38" height="56" rx="1.5"/>
    <rect x="106" y="290" width="38" height="56" rx="1.5"/>
    <rect x="154" y="290" width="38" height="56" rx="1.5"/>
    <rect x="202" y="290" width="38" height="56" rx="1.5"/>
    <rect x="250" y="290" width="38" height="56" rx="1.5"/>

    <!-- row 5 (y=354) -->
    <rect x="58" y="354" width="38" height="56" rx="1.5"/>
    <rect x="106" y="354" width="38" height="56" rx="1.5"/>
    <rect x="154" y="354" width="38" height="56" rx="1.5"/>
    <rect x="202" y="354" width="38" height="56" rx="1.5"/>
    <rect x="250" y="354" width="38" height="56" rx="1.5"/>
  </g>

  <!-- mount points (8 total for larger display) -->
  <g fill="rgba(10,10,10,0.25)">
    <circle cx="52" cy="95" r="1.5"/>
    <circle cx="348" cy="95" r="1.5"/>
    <circle cx="52" cy="420" r="1.5"/>
    <circle cx="348" cy="420" r="1.5"/>
    <circle cx="200" cy="92" r="1.5"/>
    <circle cx="200" cy="423" r="1.5"/>
  </g>

  <!-- corner serial -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="42" y="455">Ref. 025</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="42" y="473">25-CARD DISPLAY</text>
  </g>

  <!-- ruler marks -->
  <g stroke="rgba(10,10,10,0.25)" stroke-width="0.5">
    <line x1="310" y1="465" x2="358" y2="465"/>
    <line x1="310" y1="462" x2="310" y2="468"/>
    <line x1="358" y1="462" x2="358" y2="468"/>
  </g>
</svg>
