<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg3d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F6F4"/>
      <stop offset="1" stop-color="#EDEDE8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg3d)"/>

  <!-- 3D printed object: layered shape (a mount/joint) -->
  <g stroke="rgba(10, 10, 10, 0.35)" stroke-width="0.5" fill="rgba(180, 83, 9, 0.06)">
    <!-- layered horizontal lines representing 3D print layers -->
    <rect x="140" y="120" width="120" height="160" rx="2"/>
  </g>

  <!-- layer lines (3D print stratification) -->
  <g stroke="rgba(180, 83, 9, 0.3)" stroke-width="0.3">
    <line x1="142" y1="130" x2="258" y2="130"/>
    <line x1="142" y1="138" x2="258" y2="138"/>
    <line x1="142" y1="146" x2="258" y2="146"/>
    <line x1="142" y1="154" x2="258" y2="154"/>
    <line x1="142" y1="162" x2="258" y2="162"/>
    <line x1="142" y1="170" x2="258" y2="170"/>
    <line x1="142" y1="178" x2="258" y2="178"/>
    <line x1="142" y1="186" x2="258" y2="186"/>
    <line x1="142" y1="194" x2="258" y2="194"/>
    <line x1="142" y1="202" x2="258" y2="202"/>
    <line x1="142" y1="210" x2="258" y2="210"/>
    <line x1="142" y1="218" x2="258" y2="218"/>
    <line x1="142" y1="226" x2="258" y2="226"/>
    <line x1="142" y1="234" x2="258" y2="234"/>
    <line x1="142" y1="242" x2="258" y2="242"/>
    <line x1="142" y1="250" x2="258" y2="250"/>
    <line x1="142" y1="258" x2="258" y2="258"/>
    <line x1="142" y1="266" x2="258" y2="266"/>
    <line x1="142" y1="274" x2="258" y2="274"/>
  </g>

  <!-- mount holes -->
  <g stroke="rgba(10, 10, 10, 0.45)" stroke-width="0.6" fill="rgba(255,255,255,0.5)">
    <circle cx="170" cy="190" r="8"/>
    <circle cx="230" cy="190" r="8"/>
    <circle cx="170" cy="240" r="8"/>
    <circle cx="230" cy="240" r="8"/>
  </g>

  <!-- extruder nozzle -->
  <g stroke="rgba(10, 10, 10, 0.5)" stroke-width="0.8" fill="rgba(255,255,255,0.6)">
    <path d="M 195 50 L 195 80 L 200 90 L 200 105 L 200 95 L 205 90 L 205 80 L 205 50 Z"/>
    <line x1="200" y1="105" x2="200" y2="115"/>
  </g>

  <!-- filament strand -->
  <line x1="200" y1="115" x2="200" y2="120" stroke="rgba(180, 83, 9, 0.5)" stroke-width="0.8"/>

  <!-- labels -->
  <g fill="rgba(180, 83, 9, 0.55)" font-family="serif" font-style="italic" font-size="11" letter-spacing="1">
    <text x="60" y="320">ii.  3D Printing</text>
  </g>
  <g fill="rgba(10,10,10,0.4)" font-family="sans-serif" font-size="9" letter-spacing="2">
    <text x="60" y="338">CUSTOM GEOMETRY</text>
  </g>
</svg>
